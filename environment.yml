name: ai-driven-neuropsych-screening

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  # Numeric/report outputs (report JSON + LaTeX) are byte-identical across
  # library versions. The published figures, however, depend on the plotting
  # stack: seaborn 0.13 reworked violinplot rendering (fill colour/alpha and
  # panel sizing), so the manuscript figures are only reproduced with the
  # seaborn 0.12.x / matplotlib 3.8 stack used to generate them. These upper
  # bounds keep a fresh environment reproducing the committed figures.
  - numpy>=1.24,<2
  - pandas>=2.0,<3
  - scipy>=1.10
  - matplotlib>=3.7,<3.9
  - seaborn>=0.12,<0.13
  - jupyter>=1.0
  - jupyterlab>=4.0
  - ipython>=8.0
  - ipykernel>=6.0
  - pytest>=7.0
  - pillow>=10.0
